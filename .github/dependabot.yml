version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"

  # Standard libraries ship with Julia, so their compat entries stay "1".
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "julia"
    ignore:
      - dependency-name: "Dates"
      - dependency-name: "LinearAlgebra"
      - dependency-name: "Printf"
      - dependency-name: "Random"
      - dependency-name: "Test"

  - package-ecosystem: "julia"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "documentation"
      - "julia"
    ignore:
      - dependency-name: "LinearAlgebra"
