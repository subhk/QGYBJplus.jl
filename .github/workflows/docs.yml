name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Runs for the same branch, tag, or pull request take turns, and a newer
# pull-request run replaces an older one. Runs for different refs may
# overlap: one group for all of them would cancel a waiting run, such as a
# release tag's, whenever another run queued behind it. Documenter pushes to
# gh-pages without force, so a push that races another fails visibly
# instead of overwriting it.
concurrency:
  group: docs-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: write     # julia-actions/cache removes superseded caches
  contents: write    # push to gh-pages
  statuses: write    # Documenter's status link to a pull request's preview

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'

      - uses: julia-actions/cache@v3

      - name: Install dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'

      - name: Build and deploy documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
