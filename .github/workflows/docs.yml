name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

# Every run may push to gh-pages (pull requests deploy previews), and
# concurrent pushes reject each other, so the runs take turns. The preview
# cleanup workflow shares this group.
concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  actions: write     # julia-actions/cache removes superseded caches
  contents: write    # push to gh-pages
  statuses: write    # Documenter's status link to a pull request's preview

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'

      - uses: julia-actions/cache@v3

      - name: Install dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'

      - name: Build and deploy documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
