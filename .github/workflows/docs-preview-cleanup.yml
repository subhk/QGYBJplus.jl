name: Documentation preview cleanup

# Removes a pull request's documentation preview from gh-pages once the pull
# request is closed (the recipe from Documenter's hosting guide).
on:
  pull_request:
    types: [ closed ]

# Waits for the pull request's last documentation run, which shares the group.
concurrency:
  group: docs-${{ github.event.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages

      # Another documentation run may push to gh-pages meanwhile. The lease
      # makes the force push fail rather than erase that deploy, and the
      # cleanup then starts again from the new gh-pages.
      - name: Delete the preview and squash the branch history
        env:
          preview_dir: previews/PR${{ github.event.number }}
        run: |
          git config user.name "Documenter.jl"
          git config user.email "documenter@juliadocs.github.io"
          for attempt in 1 2 3 4 5; do
            git fetch -q --depth=1 origin gh-pages
            git reset -q --hard FETCH_HEAD
            [ -d "${preview_dir}" ] || exit 0
            base=$(git rev-parse HEAD)
            git rm -rq "${preview_dir}"
            git commit -qm "delete preview"
            squashed=$(echo "delete history" | git commit-tree HEAD^{tree})
            git push --force-with-lease=refs/heads/gh-pages:"${base}" \
                origin "${squashed}":refs/heads/gh-pages && exit 0
            sleep 15
          done
          exit 1
