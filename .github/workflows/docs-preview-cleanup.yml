name: Documentation preview cleanup

# Removes a pull request's documentation preview from gh-pages once the pull
# request is closed (the recipe from Documenter's hosting guide).
on:
  pull_request:
    types: [ closed ]

# Shares the documentation workflow's group, so the two never push at once.
concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Delete the preview and squash the branch history
        env:
          preview_dir: previews/PR${{ github.event.number }}
        run: |
          if [ -d "${preview_dir}" ]; then
            git config user.name "Documenter.jl"
            git config user.email "documenter@juliadocs.github.io"
            git rm -rf "${preview_dir}"
            git commit -m "delete preview"
            git branch gh-pages-new "$(echo "delete history" | git commit-tree HEAD^{tree})"
            git push --force origin gh-pages-new:gh-pages
          fi
