name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: [ '1.10', '1.11', '1.12' ]
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}

      - name: Cache artifacts
        uses: actions/cache@v6
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-julia-artifacts-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-artifacts-

      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test(coverage=true)'

      - name: Generate coverage (LCOV)
        run: |
          julia --project=. -e '
            using Pkg; Pkg.add("Coverage");
            using Coverage;
            LCOV.writefile("lcov.info", process_folder())
          '

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: lcov.info
          flags: unittests
          fail_ci_if_error: false

  threads-test:
    name: Multithreaded CPU kernels - Julia 1.10 - Ubuntu
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'

      - name: Cache artifacts
        uses: actions/cache@v4
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-julia-artifacts-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-artifacts-

      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests with four threads
        run: julia --project=. -e 'using Pkg; Pkg.test()'

  cuda-extension:
    name: CUDA extension loads - Julia 1.10 - Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'

      # No GPU on the runner: this checks that the extension loads and that
      # GPU() resolves to the CUDA backend. Kernels are tested on the CPU
      # through JLArrays in the main test suite.
      - name: Load QGYBJplus with CUDA
        run: |
          julia -e '
            using Pkg
            Pkg.activate(temp=true)
            Pkg.develop(path=pwd())
            Pkg.add("CUDA")
            using CUDA, QGYBJplus
            @assert Base.get_extension(QGYBJplus, :QGYBJplusCUDAExt) !== nothing
            @assert GPU().backend isa CUDA.CUDABackend
          '
