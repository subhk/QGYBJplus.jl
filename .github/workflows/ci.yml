name: CI

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:

# A newer push to a pull request supersedes its running checks; runs on main
# always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # A Julia prerelease may fail for reasons outside this package.
    continue-on-error: ${{ matrix.version == 'pre' }}
    permissions:
      actions: write     # julia-actions/cache removes superseded caches
      contents: read
      id-token: write    # Codecov upload with an OIDC token, no secret needed
    strategy:
      fail-fast: false
      matrix:
        version: [ '1.10', '1', 'pre' ]
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      # Pull requests from forks get no OIDC token, so their upload fails
      # without failing the job.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          disable_search: true
          use_oidc: true
          flags: unittests
          fail_ci_if_error: false

  threads-test:
    name: Multithreaded CPU kernels - Julia 1.10 - Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    env:
      JULIA_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false

  downgrade:
    name: Lowest compatible versions - Julia 1.10 - Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      # JLArrays, a test-only dependency, needs a newer KernelAbstractions than
      # the compat floor, and the downgrade action resolves the test extras
      # together with the package's dependencies. Drop them from this checkout
      # so that the resolution reaches the package's own floors; runtests.jl
      # then skips the emulated-GPU tests that use JLArrays.
      - name: Leave the test-only extras out of the resolution
        run: |
          julia --color=yes -e '
            using TOML
            project = TOML.parsefile("Project.toml")
            for name in keys(pop!(project, "extras", Dict()))
                delete!(project["compat"], name)
            end
            delete!(project, "targets")
            open(io -> TOML.print(io, project), "Project.toml", "w")'
      # Writes a Manifest.toml with the lowest versions that the [compat]
      # bounds allow together, and installs them without building them.
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          mode: deps
      # Old releases among those versions, such as FFTW 1.3, have build steps,
      # which must run before anything is precompiled.
      - name: Run tests at the lowest compatible versions
        run: |
          julia --project=. --color=yes --check-bounds=yes -e '
            using Pkg
            Pkg.instantiate(; allow_autoprecomp=false)
            Pkg.build()
            Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)
            include(joinpath(pwd(), "test", "runtests.jl"))'

  cuda-extension:
    name: CUDA extension loads - Julia 1.10 - Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'

      # No GPU on the runner: this checks that the extension loads and that
      # GPU() resolves to the CUDA backend. Kernels are tested on the CPU
      # through JLArrays in the main test suite.
      - name: Load QGYBJplus with CUDA
        run: |
          julia -e '
            using Pkg
            Pkg.activate(temp=true)
            Pkg.develop(path=pwd())
            Pkg.add("CUDA")
            using CUDA, QGYBJplus
            @assert Base.get_extension(QGYBJplus, :QGYBJplusCUDAExt) !== nothing
            @assert GPU().backend isa CUDA.CUDABackend
          '
